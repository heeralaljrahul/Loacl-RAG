<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181e; --panel2:#1b1f27; --line:#282d38;
    --text:#e8eaf0; --dim:#8b93a7; --accent:#c9a227; --accent2:#7aa2f7;
    --warn:#e0af68; --err:#f7768e;
  }
  :root[data-theme="light"]{
    --bg:#faf8f4; --panel:#fff; --panel2:#f2f0ea; --line:#e2ddd2;
    --text:#1e1c19; --dim:#6a6459; --accent:#9a7b1a; --accent2:#2f6feb;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);
    color:var(--text);font:16px/1.75 Georgia,"Iowan Old Style",'Times New Roman',serif}
  header{display:flex;gap:14px;align-items:center;padding:9px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-size:13px}
  header b{font-size:14px}
  header .when{color:var(--dim)}
  header .spacer{flex:1}
  button{font:inherit;font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
  @media (max-width:980px){main{grid-template-columns:1fr}#panel{display:none}}
  #story{overflow-y:auto;padding:30px 34px 10px}
  .entry{max-width:760px;margin:0 auto 34px}
  .entry .hdr{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    font-size:13.5px;letter-spacing:.02em;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
  .entry .body{white-space:pre-wrap;overflow-wrap:anywhere}
  .entry .body b{font-weight:700}
  .you{max-width:760px;margin:0 auto 22px;font-family:ui-sans-serif,-apple-system,sans-serif;
    font-size:13.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:12px}
  .prompt{max-width:760px;margin:0 auto 10px;font-family:ui-sans-serif,-apple-system,sans-serif;
    font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  #choices{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
  .choice{text-align:left;padding:10px 13px;font-size:14.5px;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
  .choice .k{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:11px 16px}
  .composer{max-width:760px;margin:0 auto;display:flex;gap:9px}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    min-height:44px;max-height:170px}
  textarea:focus{outline:none;border-color:var(--accent)}
  .send{background:var(--accent);border-color:var(--accent);color:#15120a;font-weight:600;padding:0 18px}
  #panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;
    padding:15px;font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-size:13px}
  .ptitle{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    margin:18px 0 8px}
  .ptitle:first-child{margin-top:0}
  .mem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;
    background:var(--panel2)}
  .mem .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2)}
  .mem .t{color:var(--dim);margin-top:3px;line-height:1.45}
  .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:var(--dim)}
  .row b{color:var(--text);font-weight:600}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .note{color:var(--warn);font-size:12px;margin:6px 0}
  .err{color:var(--err)}
  .status{max-width:760px;margin:0 auto 12px;color:var(--dim);font-size:12.5px;
    font-family:ui-sans-serif,-apple-system,sans-serif}
</style>
</head>
<body>
<header>
  <b id="title">Campaign</b>
  <span class="when" id="when"></span>
  <span class="spacer"></span>
  <span class="when" id="counts"></span>
  <button id="theme">Theme</button>
</header>

<main>
  <div id="story"></div>
  <aside id="panel">
    <p class="ptitle">Recalled this turn</p>
    <div id="memories"><div class="row">Nothing yet.</div></div>
    <p class="ptitle">Present</p>
    <div id="present"></div>
    <p class="ptitle">Standing</p>
    <div id="standing"></div>
    <p class="ptitle">Ongoing</p>
    <div id="flags"></div>
  </aside>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Type 1-5, or write what you do…  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button class="send" id="send">Play</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const story = $('#story'), input = $('#input');
let busy = false, choices = [];

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

function addEntry(headerLine, bodyText){
  const el = document.createElement('div');
  el.className = 'entry';
  el.innerHTML = `<div class="hdr">${esc(headerLine)}</div><div class="body">${md(bodyText)}</div>`;
  story.appendChild(el);
  story.scrollTop = story.scrollHeight;
  return el.querySelector('.body');
}

function addYou(text){
  const el = document.createElement('div');
  el.className = 'you';
  el.textContent = text;
  story.appendChild(el);
}

function addStatus(text, cls){
  const el = document.createElement('div');
  el.className = 'status ' + (cls || '');
  el.textContent = text;
  story.appendChild(el);
  story.scrollTop = story.scrollHeight;
  return el;
}

function renderChoices(list){
  choices = list || [];
  const old = document.getElementById('choices');
  if(old) old.remove();
  const oldPrompt = document.getElementById('prompt-line');
  if(oldPrompt) oldPrompt.remove();
  if(!choices.length) return;
  const p = document.createElement('div');
  p.className = 'prompt'; p.id = 'prompt-line'; p.textContent = 'What will you do?';
  story.appendChild(p);
  const wrap = document.createElement('div');
  wrap.id = 'choices';
  const keys = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣'];
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="k">${keys[i]}</span>${esc(c)}`;
    b.onclick = () => play(String(i + 1));
    wrap.appendChild(b);
  });
  story.appendChild(wrap);
  story.scrollTop = story.scrollHeight;
}

function renderMemories(list){
  const box = $('#memories');
  if(!list || !list.length){ box.innerHTML = '<div class="row">Nothing recalled.</div>'; return; }
  box.innerHTML = list.map(m => {
    const kind = (m.heading || '').split(' > ').pop();
    return `<div class="mem"><div class="k">${esc(kind)} · ${esc(m.title)} · ${m.score}</div>
            <div class="t">${esc(m.text)}</div></div>`;
  }).join('');
}

function renderSide(s){
  $('#title').textContent = s.title;
  $('#when').textContent = s.when + (s.location ? ' · ' + s.location : '');
  $('#counts').textContent = `turn ${s.turns} · ${s.arcs} arcs · ` +
    Object.entries(s.memories || {}).map(([k,v]) => `${v} ${k}`).join(', ');
  $('#present').innerHTML = (s.present || []).map(n => `<div class="row"><b>${esc(n)}</b></div>`).join('')
    || '<div class="row">—</div>';
  $('#standing').innerHTML = (s.relationships || []).map(r =>
    `<div class="row"><b>${esc(r.name)}</b><span>${esc(r.label)}</span></div>
     <div class="bar"><i style="width:${r.closeness * 10}%"></i></div>`).join('')
    || '<div class="row">—</div>';
  $('#flags').innerHTML = Object.entries(s.flags || {}).map(([k,v]) =>
    `<div class="row"><b>${esc(k)}</b></div><div class="row">${esc(v)}</div>`).join('')
    || '<div class="row">—</div>';
}

async function play(raw){
  const action = (raw !== undefined ? raw : input.value).trim();
  if(!action || busy) return;
  busy = true; $('#send').disabled = true;
  input.value = ''; input.style.height = 'auto';
  renderChoices([]);
  addYou(/^[1-5]$/.test(action) && choices.length ? choices[+action - 1] : action);

  let body = null, working = addStatus('…');
  try{
    const response = await fetch('/api/turn', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action})
    });
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = '', streamed = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split('\n\n'); buffer = parts.pop();
      for(const part of parts){
        if(!part.startsWith('data: ')) continue;
        const ev = JSON.parse(part.slice(6));
        if(ev.type === 'repaired'){
          addStatus('recovered memory for turn ' + ev.turns.join(', '));
        } else if(ev.type === 'recall'){
          renderMemories(ev.memories);
        } else if(ev.type === 'token'){
          if(!body){ working.remove(); body = addEntry('…', ''); }
          streamed += ev.text;
          body.innerHTML = md(streamed);
          story.scrollTop = story.scrollHeight;
        } else if(ev.type === 'revising'){
          addStatus('revising — ' + ev.problems.join('; '));
        } else if(ev.type === 'entry'){
          if(!body){ working.remove(); body = addEntry('…',''); }
          body.parentElement.querySelector('.hdr').textContent = ev.header;
          body.innerHTML = md(ev.narration);
          renderChoices(ev.choices);
        } else if(ev.type === 'arc'){
          addStatus('arc summary written');
        } else if(ev.type === 'error'){
          if(working.parentElement) working.remove();
          addStatus(ev.message, 'err');
        } else if(ev.type === 'done'){
          (ev.notes || []).forEach(n => addStatus(n, 'err'));
        }
      }
    }
  }catch(err){
    addStatus(String(err), 'err');
  }
  if(working && working.parentElement) working.remove();
  busy = false; $('#send').disabled = false;
  loadState(); input.focus();
}

async function loadState(){
  const s = await (await fetch('/api/state')).json();
  renderSide(s);
  return s;
}

async function boot(){
  const s = await loadState();
  const history = await (await fetch('/api/history?limit=6')).json();
  for(const t of history.turns){
    if(t.player_input) addYou(t.player_input);
    const lines = t.text.split('\n');
    const promptAt = lines.findIndex(l => l.includes('What will you do?'));
    const body = (promptAt > 0 ? lines.slice(1, promptAt) : lines.slice(1)).join('\n').trim();
    addEntry(lines[0], body);
  }
  if(!history.turns.length){
    addStatus('No entries yet. Describe how the scene opens, or type "begin".');
  }
  renderChoices(s.choices);
  story.scrollTop = story.scrollHeight;
}

$('#send').onclick = () => play();
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); play(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
});
document.addEventListener('keydown', e => {
  if(document.activeElement === input) return;
  if(/^[1-5]$/.test(e.key) && choices.length && !busy) play(e.key);
});
$('#theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('rpg-theme', next); }catch(e){}
};
try{ const t = localStorage.getItem('rpg-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
boot(); input.focus();
</script>
</body>
</html>
